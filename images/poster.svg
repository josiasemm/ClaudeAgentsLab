<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" width="1100" height="420" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="posterBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A11"/>
      <stop offset="50%" stop-color="#0D1322"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Warm Amber Glow for Claude -->
    <radialGradient id="amberAura" cx="30%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#D97706" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#D97706" stop-opacity="0"/>
    </radialGradient>

    <!-- Cyan Glow for Tests/Python -->
    <radialGradient id="cyanAura" cx="85%" cy="80%" r="55%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0"/>
    </radialGradient>

    <!-- Outer Border -->
    <linearGradient id="posterBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.7"/>
      <stop offset="40%" stop-color="#F59E0B" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Text Amber Gradient -->
    <linearGradient id="textAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Subtle Dot Matrix Pattern -->
    <pattern id="dotPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" fill-opacity="0.25"/>
    </pattern>

    <style>
      .font-sans {
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, sans-serif;
      }
      .font-mono {
        font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace;
      }
    </style>
  </defs>

  <!-- Poster Canvas -->
  <rect x="2" y="2" width="1096" height="416" rx="20" fill="url(#posterBg)"/>
  <rect x="2" y="2" width="1096" height="416" rx="20" fill="url(#dotPattern)"/>
  <rect x="2" y="2" width="1096" height="416" rx="20" fill="url(#amberAura)"/>
  <rect x="2" y="2" width="1096" height="416" rx="20" fill="url(#cyanAura)"/>
  <rect x="2" y="2" width="1096" height="416" rx="20" fill="none" stroke="url(#posterBorder)" stroke-width="1.5"/>

  <!-- ================= LEFT COLUMN: HERO HEADLINE ================= -->
  <g transform="translate(56, 52)">
    <!-- Pill Category -->
    <g>
      <rect width="210" height="24" rx="12" fill="#D97706" fill-opacity="0.12" stroke="#D97706" stroke-width="1" stroke-opacity="0.4"/>
      <circle cx="14" cy="12" r="3.5" fill="#F59E0B"/>
      <text x="26" y="16" fill="#F59E0B" font-size="10.5" font-weight="700" class="font-mono" letter-spacing="0.8">CLAUDE CODE ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="74" fill="#FFFFFF" font-size="44" font-weight="800" class="font-sans" letter-spacing="-1.5">
      ClaudeAgentsLab
    </text>

    <!-- Gradient Tagline -->
    <text x="0" y="112" fill="url(#textAmber)" font-size="21" font-weight="700" class="font-sans" letter-spacing="-0.3">
      The Read-Only AI Audit Laboratory
    </text>

    <!-- Paragraph Description -->
    <text x="0" y="148" fill="#94A3B8" font-size="14.5" font-weight="400" class="font-sans">
      <tspan x="0" dy="0">What happens when you tie an AI agent's hands?</tspan>
      <tspan x="0" dy="24">Instead of letting models edit and break your codebase,</tspan>
      <tspan x="0" dy="24">we deploy specialized inspectors to isolate logic flaws</tspan>
      <tspan x="0" dy="24">and audit test suites with zero mutations.</tspan>
    </text>

    <!-- Feature Badges -->
    <g transform="translate(0, 240)">
      <!-- Badge 1: Read-Only -->
      <g>
        <rect width="180" height="28" rx="14" fill="#0F172A" stroke="#334155" stroke-width="1"/>
        <text x="14" y="18" fill="#10B981" font-size="11" font-weight="700" class="font-mono">✔</text>
        <text x="32" y="18" fill="#E2E8F0" font-size="11.5" font-weight="500" class="font-sans">Strict Read-Only Mode</text>
      </g>

      <!-- Badge 2: Zero Writes -->
      <g transform="translate(192, 0)">
        <rect width="170" height="28" rx="14" fill="#0F172A" stroke="#334155" stroke-width="1"/>
        <text x="14" y="18" fill="#F59E0B" font-size="11" font-weight="700" class="font-mono">⚡</text>
        <text x="32" y="18" fill="#E2E8F0" font-size="11.5" font-weight="500" class="font-sans">Zero Writes Executed</text>
      </g>
    </g>
  </g>

  <!-- ================= RIGHT COLUMN: DUAL SUBAGENTS CARDS ================= -->
  <g transform="translate(560, 48)">

    <!-- Subagent 1 Card: Code Reviewer -->
    <g transform="translate(0, 0)">
      <rect width="480" height="145" rx="14" fill="#0B1120" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
      <rect x="0" y="0" width="480" height="145" rx="14" fill="none" stroke="#D97706" stroke-width="1" stroke-opacity="0.25"/>

      <!-- Icon & Name -->
      <text x="22" y="34" font-size="20">🔍</text>
      <text x="56" y="32" fill="#FFFFFF" font-size="16.5" font-weight="700" class="font-sans">code-reviewer</text>
      
      <!-- Role Tag -->
      <g transform="translate(340, 16)">
        <rect width="118" height="20" rx="10" fill="#D97706" fill-opacity="0.15" stroke="#D97706" stroke-width="0.75" stroke-opacity="0.5"/>
        <text x="59" y="14" text-anchor="middle" fill="#F59E0B" font-size="9.5" font-weight="700" class="font-mono">LOGIC INSPECTOR</text>
      </g>

      <!-- Description -->
      <text x="22" y="66" fill="#94A3B8" font-size="12.5" font-weight="400" class="font-sans">
        <tspan x="22" dy="0">Hunts down runtime crashes, NoneType dereferencing,</tspan>
        <tspan x="22" dy="20">inverted boolean logic, and broken function contracts.</tspan>
      </text>

      <!-- Bottom Tools Bar -->
      <line x1="22" y1="108" x2="458" y2="108" stroke="#1E293B" stroke-width="1"/>
      <text x="22" y="128" fill="#64748B" font-size="10" font-weight="600" class="font-mono">PERMISSIONS:</text>
      <text x="115" y="128" fill="#F59E0B" font-size="10.5" font-weight="700" class="font-mono">Read · Grep · Glob</text>
      <text x="360" y="128" fill="#64748B" font-size="10" font-weight="500" class="font-mono">TARGET: src/*.py</text>
    </g>

    <!-- Subagent 2 Card: Test Reviewer -->
    <g transform="translate(0, 165)">
      <rect width="480" height="145" rx="14" fill="#0B1120" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
      <rect x="0" y="0" width="480" height="145" rx="14" fill="none" stroke="#0284C7" stroke-width="1" stroke-opacity="0.3"/>

      <!-- Icon & Name -->
      <text x="22" y="34" font-size="20">🧪</text>
      <text x="56" y="32" fill="#FFFFFF" font-size="16.5" font-weight="700" class="font-sans">test-reviewer</text>
      
      <!-- Role Tag -->
      <g transform="translate(340, 16)">
        <rect width="118" height="20" rx="10" fill="#0284C7" fill-opacity="0.15" stroke="#0284C7" stroke-width="0.75" stroke-opacity="0.5"/>
        <text x="59" y="14" text-anchor="middle" fill="#38BDF8" font-size="9.5" font-weight="700" class="font-mono">PYTEST AUDITOR</text>
      </g>

      <!-- Description -->
      <text x="22" y="66" fill="#94A3B8" font-size="12.5" font-weight="400" class="font-sans">
        <tspan x="22" dy="0">Audits test suite rigor, detects missing edge-cases,</tspan>
        <tspan x="22" dy="20">empty collections, weak assertions, and uncovered paths.</tspan>
      </text>

      <!-- Bottom Tools Bar -->
      <line x1="22" y1="108" x2="458" y2="108" stroke="#1E293B" stroke-width="1"/>
      <text x="22" y="128" fill="#64748B" font-size="10" font-weight="600" class="font-mono">PERMISSIONS:</text>
      <text x="115" y="128" fill="#38BDF8" font-size="10.5" font-weight="700" class="font-mono">Read · Grep · Glob</text>
      <text x="350" y="128" fill="#64748B" font-size="10" font-weight="500" class="font-mono">TARGET: tests/*.py</text>
    </g>

  </g>
</svg>
